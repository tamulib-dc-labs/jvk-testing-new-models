# Whisper Transcript Reviewer Configuration
# Edit these values to customize your site

site:
  # Page title (appears in browser tab and header)
  title: "Testing New Audio Models"

  # Subtitle shown below the title
  subtitle: "Review VTTs Generated by Whisper or Whisper X."

  # Footer text
  footer_text: "Whisper JSON Viewer"

  # DaisyUI theme (see https://daisyui.com/docs/themes/)
  # Options: light, dark, cupcake, synthwave, cyberpunk, valentine, etc.
  theme: "coffee"

  # Repository ("owner/name") the branch switcher reads pipeline runs from.
  # Each branch's public/config.json becomes a selectable run in the header.
  # Leave blank to auto-detect from the GitHub Pages URL.
  repository: "tamulib-dc-labs/jvk-testing-new-models"

# Build configuration (optional)
# build:
#   # Custom base path for deployment (auto-detected from repo name if not set)
#   base_path: "/custom-path/"
